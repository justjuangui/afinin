# Generated by scripts/generate-policy-templates.py from policies/afinin-readonly.json. Do not edit.
#
# Read-only role for Afinín. Deploy to one account, or to every account in an
# AWS Organization as a CloudFormation StackSet:
#
#   aws cloudformation create-stack-set --stack-set-name afinin-readonly \
#     --template-body file://afinin-readonly-role.yaml \
#     --permission-model SERVICE_MANAGED --auto-deployment Enabled=true,RetainStacksOnAccountRemoval=false \
#     --capabilities CAPABILITY_NAMED_IAM \
#     --parameters ParameterKey=TrustedPrincipalArn,ParameterValue=<arn>
#   aws cloudformation create-stack-instances --stack-set-name afinin-readonly \
#     --deployment-targets OrganizationalUnitIds=<root-or-ou-id> --regions us-east-1
AWSTemplateFormatVersion: "2010-09-09"
Description: Read-only IAM role assumed by Afinín (never mutates resources).

Parameters:
  TrustedPrincipalArn:
    Type: String
    Description: >-
      Who may assume the role, e.g. the IAM Identity Center role or the management
      account root (arn:aws:iam::<management-account-id>:root).
  RoleName:
    Type: String
    Default: AfininReadOnly
  ExternalId:
    Type: String
    Default: ""
    Description: Optional external ID required when assuming the role.

Conditions:
  HasExternalId: !Not [!Equals [!Ref ExternalId, ""]]

Resources:
  Role:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      Description: Read-only access for Afinín cost and inventory analysis
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Ref TrustedPrincipalArn
            Action: sts:AssumeRole
            Condition: !If
              - HasExternalId
              - StringEquals:
                  sts:ExternalId: !Ref ExternalId
              - !Ref AWS::NoValue
      Policies:
        - PolicyName: afinin-readonly
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Identity
                Effect: Allow
                Action:
                  - "sts:GetCallerIdentity"
                Resource: "*"
              - Sid: Organizations
                Effect: Allow
                Action:
                  - "organizations:ListAccounts"
                  - "organizations:DescribeOrganization"
                Resource: "*"
              - Sid: CostExplorer
                Effect: Allow
                Action:
                  - "ce:Get*"
                  - "ce:Describe*"
                  - "ce:List*"
                Resource: "*"
              - Sid: Inventory
                Effect: Allow
                Action:
                  - "ec2:DescribeRegions"
                  - "ec2:DescribeInstances"
                  - "ec2:DescribeVolumes"
                  - "ec2:DescribeVpcs"
                  - "ec2:DescribeSubnets"
                  - "ec2:DescribeSecurityGroups"
                  - "ec2:DescribeNatGateways"
                  - "ec2:DescribeAddresses"
                  - "ec2:DescribeNetworkInterfaces"
                  - "ec2:DescribeSnapshots"
                  - "elasticloadbalancing:DescribeLoadBalancers"
                  - "elasticloadbalancing:DescribeTargetGroups"
                  - "elasticloadbalancing:DescribeTargetHealth"
                  - "rds:DescribeDBInstances"
                  - "rds:DescribeDBClusters"
                  - "lambda:ListFunctions"
                  - "lambda:ListEventSourceMappings"
                  - "s3:ListAllMyBuckets"
                  - "dynamodb:ListTables"
                  - "dynamodb:DescribeTable"
                  - "elasticache:DescribeCacheClusters"
                  - "elasticache:DescribeCacheSubnetGroups"
                  - "ecs:ListClusters"
                  - "ecs:DescribeClusters"
                  - "ecs:ListServices"
                  - "ecs:DescribeServices"
                  - "eks:ListClusters"
                  - "eks:DescribeCluster"
                  - "cloudfront:ListDistributions"
                  - "apigateway:GET"
                  - "sqs:ListQueues"
                  - "sns:ListTopics"
                  - "sns:ListSubscriptions"
                  - "lightsail:GetRegions"
                  - "lightsail:GetInstances"
                  - "lightsail:GetRelationalDatabases"
                  - "lightsail:GetLoadBalancers"
                  - "lightsail:GetDisks"
                  - "lightsail:GetStaticIps"
                  - "tag:GetResources"
                Resource: "*"
              - Sid: CurExport
                Effect: Allow
                Action:
                  - "bcm-data-exports:ListExports"
                  - "bcm-data-exports:GetExport"
                Resource: "*"
              - Sid: PublicPrices
                Effect: Allow
                Action:
                  - "pricing:GetProducts"
                Resource: "*"

Outputs:
  RoleArn:
    Value: !GetAtt Role.Arn
