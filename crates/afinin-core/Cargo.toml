[package]
name = "afinin-core"
description = "Core library of Afinín: read-only AWS cost and inventory analysis"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-credential-types = "1"
aws-sdk-sso = "1"
aws-sdk-ssooidc = "1"
aws-sdk-sts = "1"
aws-sdk-costexplorer = "1"
aws-sdk-ec2 = "1"
aws-sdk-elasticloadbalancingv2 = "1"
aws-sdk-rds = "1"
aws-sdk-lambda = "1"
aws-sdk-s3 = "1"
aws-sdk-dynamodb = "1"
aws-sdk-ecs = "1"
aws-sdk-eks = "1"
aws-sdk-cloudfront = "1"
aws-sdk-apigateway = "1"
aws-sdk-apigatewayv2 = "1"
aws-sdk-sqs = "1"
aws-sdk-sns = "1"
aws-sdk-elasticache = "1"
aws-sdk-resourcegroupstagging = "1"
aws-sdk-bcmdataexports = "1"
aws-sdk-pricing = "1"
aws-sdk-bedrockruntime = "1"
aws-smithy-types = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "http2"] }
regex = "1"
argon2 = "0.5"
chacha20poly1305 = "0.10"
tar = "0.4"
futures = "0.3"
duckdb = { version = "1", features = ["bundled"] }
keyring = "4"
directories = "6"
rand = "0.9"
hex = "0.4"
sha1_smol = "1"
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }

[dev-dependencies]
tempfile = "3"
