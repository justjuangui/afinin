[package]
name = "afinin-desktop"
description = "Afinín desktop app"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "afinin_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Signed auto-updates (NFR-6). Release builds enable it together with
# tauri.release.conf.json, which carries the update public key.
updater = ["dep:tauri-plugin-updater"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
afinin-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tauri = { version = "2.12", features = [] }
tauri-plugin-opener = "2.7"
tauri-plugin-dialog = "2.8"
tauri-plugin-updater = { version = "2.13", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
