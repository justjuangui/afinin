# SPDX-License-Identifier: MIT OR Apache-2.0
#
# Signed installers for macOS, Linux and Windows, the signed update manifest
# and SBOMs (NFR-6), attached to a draft GitHub release. Run it by hand:
# Actions → Release → Run workflow, with the version to release. Nothing else
# starts it. Required secrets and the steps around it are in RELEASING.md.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.1.0 (must match Cargo.toml, package.json, tauri.conf.json and a CHANGELOG heading)"
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Check and tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          [ "$GITHUB_REF" = "refs/heads/main" ] || fail "Run the release from main (this run is on $GITHUB_REF)."
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || fail "\"$VERSION\" is not a version like 0.1.0 (without the v)."
          cargo=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version *= *"\(.*\)"/\1/p' Cargo.toml)
          npm=$(node -p 'require("./apps/desktop/package.json").version')
          tauri=$(node -p 'require("./apps/desktop/src-tauri/tauri.conf.json").version')
          for pair in "Cargo.toml:$cargo" "apps/desktop/package.json:$npm" "apps/desktop/src-tauri/tauri.conf.json:$tauri"; do
            [ "${pair#*:}" = "$VERSION" ] || fail "${pair%%:*} has version ${pair#*:}, not $VERSION."
          done
          grep -E "^## (.*[^0-9.])?${VERSION//./\\.}([^0-9A-Za-z.-]|$)" CHANGELOG.md | grep -vqi unreleased \
            || fail "CHANGELOG.md has no released heading for $VERSION (e.g. \"## v$VERSION — 2026-11-02\")."
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            fail "Tag v$VERSION already exists. Bump the version, or delete the tag and its draft release first."
          fi

      - name: CI passed on this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          result=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --json conclusion --jq 'map(.conclusion) | if any(. == "success") then "success" else (.[0] // "none") end')
          [ "$result" = "success" ] || { echo "::error::CI has not passed on $GITHUB_SHA (latest: $result). Wait for it, or fix main first."; exit 1; }

      - name: Tag
        id: tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Afinín v$VERSION"
          git push origin "v$VERSION"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.target }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsecret-1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
        working-directory: apps/desktop

      # Database encryption needs DuckDB's httpfs extension: ship it, so the
      # app works offline from the first launch (see tauri.release.conf.json).
      - name: DuckDB httpfs extension
        shell: bash
        run: bash scripts/fetch-httpfs.sh ${{ matrix.target }} apps/desktop/src-tauri/resources/duckdb/httpfs.duckdb_extension

      # Installed apps look for updates in the repository that published them.
      - name: Inject the update key and address
        shell: bash
        env:
          TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: |
          test -n "$TAURI_UPDATER_PUBKEY" || { echo "::error::Set the TAURI_UPDATER_PUBKEY repository variable (see RELEASING.md)"; exit 1; }
          node -e '
            const f = "apps/desktop/src-tauri/tauri.release.conf.json";
            const c = require("./" + f);
            c.plugins.updater.pubkey = process.env.TAURI_UPDATER_PUBKEY;
            c.plugins.updater.endpoints = [`https://github.com/${process.env.GITHUB_REPOSITORY}/releases/latest/download/latest.json`];
            require("fs").writeFileSync(f, JSON.stringify(c, null, 2));
          '

      # macOS code signing and notarization, once its secrets exist. A secret
      # that isn't set still arrives as an empty variable, and Tauri then
      # tries to import an empty certificate and fails: pass them only when
      # the certificate is there. Without them the app is signed ad hoc
      # (`signingIdentity: "-"` in tauri.release.conf.json).
      - name: macOS signing secrets, when configured
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::warning::No APPLE_CERTIFICATE secret: the macOS app is signed ad hoc, not notarized (see RELEASING.md)."
            exit 0
          fi
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!name}" ] || continue
            { echo "$name<<APPLE_EOF"; printf '%s\n' "${!name}"; echo "APPLE_EOF"; } >> "$GITHUB_ENV"
          done

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseName: Afinín ${{ needs.prepare.outputs.tag }}
          # Keep the warning until macOS notarization and Windows signing are set up.
          releaseBody: |
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for what's new.

            > [!WARNING]
            > **These installers aren't code-signed yet**, so your system warns you the first time you open Afinín.
            > - **macOS**: "Apple could not verify…". Right-click Afinín in Applications → **Open** (or System Settings → Privacy & Security → **Open Anyway**).
            > - **Windows**: "Windows protected your PC". Click **More info** → **Run anyway**.
            >
            > The warning is about the missing signature, not about the app: Afinín is open source, read-only on AWS, and built by this repository's [release workflow](https://github.com/${{ github.repository }}/actions/workflows/release.yml). See [first launch](https://github.com/${{ github.repository }}#first-launch-unsigned-installers).

            **Downloads**: `.dmg` (macOS, Apple Silicon or Intel), `.msi` or `-setup.exe` (Windows), `.AppImage`, `.deb` or `.rpm` (Linux). The `.sig` files are for the auto-updater; `*.cdx.json` are the SBOMs.
          releaseDraft: true
          includeUpdaterJson: true
          args: --target ${{ matrix.target }} --features updater --config src-tauri/tauri.release.conf.json

  sbom:
    name: SBOM
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Rust SBOM (CycloneDX)
        run: |
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx --format json --override-filename afinin-rust.cdx
          find . -name 'afinin-rust.cdx.json' -exec cp {} . \; -quit
      - name: npm SBOM (CycloneDX)
        working-directory: apps/desktop
        run: |
          npm ci
          npx --yes @cyclonedx/cyclonedx-npm --omit dev --output-file ../../afinin-npm.cdx.json
      - name: Attach to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.prepare.outputs.tag }}" afinin-rust.cdx.json afinin-npm.cdx.json --clobber
